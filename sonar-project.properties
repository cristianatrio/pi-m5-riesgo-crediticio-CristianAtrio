# SonarCloud (extra credit): calidad, seguridad, cobertura de pruebas y estilo.
# El analisis corre en el CI (.github/workflows/ci.yml, job "sonarcloud") despues de generar:
#   coverage.xml       -> pytest --cov (cobertura de pruebas)
#   ruff-report.txt    -> ruff check (estilo / convenciones, se importa como issues externos)
#   bandit-report.json -> bandit (seguridad, se importa como issues externos)
sonar.projectKey=cristianatrio_pi-m5-riesgo-crediticio-CristianAtrio
sonar.organization=cristianatrio
sonar.projectName=PI M5 - Modelo de riesgo crediticio
sonar.projectVersion=1.4.0

# Codigo fuente y pruebas
sonar.sources=mlops_pipeline/src,Dockerfile,Dockerfile.app,docker-compose.yml,.github/workflows
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Los notebooks son analisis exploratorio (Avance 1): se analizan como codigo pero no cuentan para cobertura
sonar.coverage.exclusions=**/*.ipynb
# Los notebooks repiten el mismo patron de grafico entre celdas: se excluyen de la deteccion de duplicados
sonar.cpd.exclusions=**/*.ipynb

# Reportes generados en el CI
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
sonar.python.ruff.reportPaths=ruff-report.txt
sonar.python.bandit.reportPaths=bandit-report.json
