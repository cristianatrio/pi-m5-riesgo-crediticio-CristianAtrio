name: CI - validacion del pipeline

on:
  push:
    branches: [developer, certification, master]
  pull_request:
    branches: [certification, master]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        # requirements.lock: versiones y hashes de todas las dependencias (generado desde requirements.txt con uv)
        run: "pip install --only-binary :all: --require-hashes -r requirements.lock"

      - name: Compilar scripts
        run: python -m py_compile mlops_pipeline/src/*.py

      - name: Ingenieria de caracteristicas
        run: python mlops_pipeline/src/ft_engineering.py

      - name: Monitoreo de drift (temporal + sintetico, autotest del detector)
        run: python mlops_pipeline/src/model_monitoring.py --escenario ambos

      - name: Smoke test del modelo serializado
        run: |
          python - <<'EOF'
          import sys, json, joblib, pandas as pd
          sys.path.insert(0, "mlops_pipeline/src")
          from ft_engineering import COLUMNAS_REQUERIDAS, cargar_datos
          modelo = joblib.load("mlops_pipeline/models/modelo_riesgo.joblib")
          proba = modelo.predict_proba(cargar_datos().head(50)[COLUMNAS_REQUERIDAS])[:, 1]
          assert proba.shape == (50,) and (0 <= proba).all() and (proba <= 1).all()
          umbral = json.load(open("mlops_pipeline/reports/metrics.json"))["umbral_decision"]
          print(f"OK: 50 predicciones, media {proba.mean():.3f}, umbral {umbral}")
          EOF

      - name: Estilo (ruff) - falla si hay issues
        run: ruff check mlops_pipeline/src tests

      - name: Seguridad (bandit) - falla con severidad media o alta
        run: bandit -c pyproject.toml -r mlops_pipeline/src -ll

      - name: Pruebas (API, pipeline, entrenamiento, monitoreo y app) con cobertura
        run: python -m pytest tests --cov --cov-report=xml:coverage.xml --cov-report=term --junitxml=test-results.xml

      - name: Reportes para SonarCloud (ruff y bandit sin cortar el pipeline)
        if: always()
        run: |
          ruff check mlops_pipeline/src tests --output-format=concise --exit-zero > ruff-report.txt
          bandit -c pyproject.toml -r mlops_pipeline/src -f json -o bandit-report.json --exit-zero

      - name: Publicar reportes de calidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-calidad
          path: |
            coverage.xml
            test-results.xml
            ruff-report.txt
            bandit-report.json

      - name: Publicar reportes de drift
        uses: actions/upload-artifact@v4
        with:
          name: reportes-drift
          path: mlops_pipeline/reports/drift/

  sonarcloud:
    runs-on: ubuntu-latest
    needs: validar
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo: SonarCloud lo usa para blame y codigo nuevo

      - name: Descargar reportes de cobertura, pruebas, ruff y bandit
        uses: actions/download-artifact@v4
        with:
          name: reportes-calidad

      - name: Analisis SonarCloud (calidad, seguridad, cobertura y estilo)
        if: env.SONAR_TOKEN != ''
        # Fijada por SHA (no por tag, que es mutable): evita que un cambio en la action ejecute codigo no revisado
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2

      - name: Aviso si falta el token
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN no configurado; se omite el analisis de SonarCloud (ver readme, seccion Extra credit)."

  docker:
    runs-on: ubuntu-latest
    needs: validar
    steps:
      - uses: actions/checkout@v4

      - name: Build de la imagen de la API
        run: docker build -t riesgo-api:ci .

      - name: Build de la imagen de la app Streamlit
        run: docker build -f Dockerfile.app -t riesgo-app:ci .

      - name: Levantar el contenedor y probar los endpoints
        run: |
          API_KEY=$(openssl rand -hex 16)  # clave efimera: solo vive en este job
          docker run -d --name riesgo-api -p 8000:8000 -e API_KEY="$API_KEY" riesgo-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          echo
          CUERPO='{"tipo_credito":4,"capital_prestado":1921920,"plazo_meses":10,"edad_cliente":42,"tipo_laboral":"Empleado","salario_cliente":3000000,"total_otros_prestamos":1000000,"cuota_pactada":182863,"puntaje_datacredito":791,"cant_creditosvigentes":5,"huella_consulta":4,"saldo_mora":0,"saldo_total":16178,"saldo_principal":14442,"saldo_mora_codeudor":0,"creditos_sectorFinanciero":2,"creditos_sectorCooperativo":0,"creditos_sectorReal":1,"promedio_ingresos_datacredito":1204496,"tendencia_ingresos":"Creciente"}'
          CODIGO=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/predict -H "Content-Type: application/json" -d "$CUERPO")
          echo "Sin API key -> HTTP $CODIGO (se espera 401)"
          test "$CODIGO" = "401"
          curl -fsS -X POST http://localhost:8000/predict -H "Content-Type: application/json" -H "X-API-Key: $API_KEY" -d "$CUERPO"
          echo
          docker image ls riesgo-api:ci --format "Imagen: {{.Repository}}:{{.Tag}} {{.Size}}"

      - name: Logs del contenedor
        if: always()
        run: docker logs riesgo-api || true
