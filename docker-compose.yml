# Levanta la API y la app Streamlit como dos servicios independientes (un proceso por contenedor).
#   docker compose up -d --build
#   API: http://localhost:8000/docs   |   App: http://localhost:8501
#   docker compose down
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: riesgo-api:1.3.0
    container_name: riesgo-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: riesgo-app:1.3.0
    container_name: riesgo-app
    ports:
      - "8501:8501"
    restart: unless-stopped
