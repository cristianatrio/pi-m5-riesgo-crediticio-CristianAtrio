# Levanta la API y la app Streamlit como dos servicios independientes (un proceso por contenedor).
#   La API exige una clave: definir API_KEY en un archivo .env junto a este compose (ignorado por git)
#   o en la terminal ($env:API_KEY = "..." en PowerShell, export API_KEY=... en bash).
#   docker compose up -d --build
#   API: http://localhost:8000/docs (boton Authorize)   |   App: http://localhost:8501
#   docker compose down
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: riesgo-api:1.5.0
    container_name: riesgo-api
    environment:
      API_KEY: ${API_KEY:?Definir la variable API_KEY (ver comentario al inicio del archivo)}
    ports:
      - "8000:8000"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: riesgo-app:1.5.0
    container_name: riesgo-app
    ports:
      - "8501:8501"
    restart: unless-stopped
